services:
  - type: web
    name: portfolio-app
    env: node
    region: frankfurt
    plan: free
    rootDir: portfolio-app
    buildCommand: npm install && node prebuild.js && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: NODE_ENV
        value: production
